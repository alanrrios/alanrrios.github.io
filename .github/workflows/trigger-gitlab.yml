# Workflow 2: GitHub content → GitLab content-sync → Cloudflare blog.
# Do not put Cloudflare API tokens in this public repo.
#
# Secrets (alanrrios/alanrrios.github.io):
#   GITLAB_PIPELINE_TRIGGER_TOKEN  GitLab Settings → CI/CD → Pipeline trigger tokens
#   GITLAB_PROJECT_ID              numeric id of gitlab.com/yozsh/alanrrios
#                                  (CI identity yozsh-cicd-20260923). Not yo_alanrrioscom.
#   STRIPE_WEBHOOK_SECRET          Signing secret for alanrrios.com/dashboard/api/stripe/webhook.
#   STRIPE_SECRET_KEY              Restricted key (rk_) for Checkout, catalog, portal.
#   STRIPE_THUMBS_UP_PRICE_ID      price_ or prod_ for the Thumbs up plan.
#   STRIPE_HIGH_FIVE_PRICE_ID      price_ or prod_ for the High five plan.
#   STRIPE_THUNDER_DAP_PRICE_ID    price_ or prod_ for the Thunder dap plan.
#     Those five are forwarded only on a manual run. GitLab writes each set
#     value onto dashboard-alanrrios with CLOUDFLARE_API_TOKEN.
#     Do not put that Cloudflare token in this repo.
#
# Blacksmith: later swap `runs-on` to a Blacksmith label
# (e.g. blacksmith-4vcpu-ubuntu-2404). Keep ubuntu-latest until then.

name: Trigger GitLab content deploy

on:
  push:
    branches: [master]
    paths:
      - "content/**"
  workflow_dispatch:

concurrency:
  group: gitlab-content-deploy
  cancel-in-progress: false

jobs:
  trigger-gitlab:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger GitLab pipeline
        env:
          GITLAB_PIPELINE_TRIGGER_TOKEN: ${{ secrets.GITLAB_PIPELINE_TRIGGER_TOKEN }}
          GITLAB_PROJECT_ID: ${{ secrets.GITLAB_PROJECT_ID }}
          GITHUB_SHA: ${{ github.sha }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_THUMBS_UP_PRICE_ID: ${{ secrets.STRIPE_THUMBS_UP_PRICE_ID }}
          STRIPE_HIGH_FIVE_PRICE_ID: ${{ secrets.STRIPE_HIGH_FIVE_PRICE_ID }}
          STRIPE_THUNDER_DAP_PRICE_ID: ${{ secrets.STRIPE_THUNDER_DAP_PRICE_ID }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test -n "$GITLAB_PIPELINE_TRIGGER_TOKEN"
          test -n "$GITLAB_PROJECT_ID"
          args=(
            --fail --silent --show-error --request POST
            --form "token=${GITLAB_PIPELINE_TRIGGER_TOKEN}"
            --form "ref=main"
            --form "variables[TRIGGER_SOURCE]=github-pages-content"
            --form "variables[GITHUB_SHA]=${GITHUB_SHA}"
          )
          # Manual run only. A content push must not put Stripe values into the pipeline.
          # --form-string keeps whsec_ / sk_ / rk_ / price_ / prod_ literal.
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            for name in \
              STRIPE_WEBHOOK_SECRET \
              STRIPE_SECRET_KEY \
              STRIPE_THUMBS_UP_PRICE_ID \
              STRIPE_HIGH_FIVE_PRICE_ID \
              STRIPE_THUNDER_DAP_PRICE_ID
            do
              value="${!name}"
              if [ -n "$value" ]; then
                args+=(--form-string "variables[${name}]=${value}")
              fi
            done
          fi
          curl "${args[@]}" \
            "https://gitlab.com/api/v4/projects/${GITLAB_PROJECT_ID}/trigger/pipeline"
